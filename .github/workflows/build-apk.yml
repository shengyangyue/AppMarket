name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
       - name: Upload APK
         uses: actions/upload-artifact@v4
         with:
               name: AppMarket APK
               path: |
                 app/android/build/outputs/apk/release/*.apk
